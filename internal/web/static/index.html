<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>estui — Elasticsearch TUI</title>
<style>
:root { --bg:#0F172A;--surface:#1E293B;--surface-hi:#334155;--primary:#8B5CF6;--primary-bg:#2E1065;--good:#10B981;--warn:#F59E0B;--danger:#F43F5E;--text:#F8FAFC;--muted:#64748B;--muted-fg:#94A3B8;--border:#334155;--radius:8px;--radius-sm:4px; }
* { margin:0;padding:0;box-sizing:border-box; }
body { background:var(--bg);color:var(--text);font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden; }
header { background:var(--surface);padding:6px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0; }
header .logo { color:var(--primary);font-weight:700;font-size:16px; }
.dot { width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0; }
.dot.ok { background:var(--good); }
.dot.err { background:var(--danger); }
.dot.testing { background:var(--warn);animation:blink .6s infinite alternate; }
@keyframes blink { to { opacity:.3; } }
nav { display:flex;gap:4px;padding:4px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0; }
nav button.tab { background:none;border:none;color:var(--muted);padding:6px 16px;cursor:pointer;font-size:14px;border-radius:var(--radius-sm);font-weight:500; }
nav button.tab:hover { color:var(--text);background:var(--surface-hi); }
nav button.tab.active { color:var(--primary);border-bottom:2px solid var(--primary);border-radius:0; }
main { flex:1;overflow-y:auto;padding:12px 16px; }
footer { background:var(--surface);padding:4px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--border);flex-shrink:0; }
.card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px; }
.card-header { display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;gap:8px;flex-wrap:wrap; }
.card-body { padding:8px 0;max-height:calc(100vh - 280px);overflow-y:auto; }
.card-body.loading,.card-body.empty { padding:24px;text-align:center;color:var(--primary); }
table { width:100%;border-collapse:collapse;font-size:13px; }
th { text-align:left;padding:7px 10px;background:var(--surface);color:var(--muted-fg);font-weight:600;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1; }
td { padding:4px 10px;border-bottom:1px solid var(--surface-hi);white-space:nowrap;cursor:pointer; }
tr:hover td { background:var(--surface-hi); }
tr:nth-child(even) td { background:rgba(30,41,59,0.3); }
tr.sel td { background:var(--primary-bg); }
tr.sel td:first-child { border-left:3px solid var(--primary);padding-left:7px; }
.health-dot { display:inline-flex;align-items:center;gap:4px; }
.health-dot::before { content:'';width:8px;height:8px;border-radius:50%;display:inline-block; }
.health-dot.green::before { background:var(--good); }
.health-dot.yellow::before { background:var(--warn); }
.health-dot.red::before { background:var(--danger); }
.status-open { color:var(--good);font-weight:600; }
.status-close { color:var(--warn);font-weight:600; }
.search-box { background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);font-size:12px;outline:none; }
.search-box:focus { border-color:var(--primary); }
.btn { background:var(--primary);color:#fff;border:none;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap; }
.btn:hover { opacity:.9; }
.btn:disabled { opacity:.4;cursor:not-allowed; }
.btn-danger { background:var(--danger); }
.btn-warn { background:var(--warn);color:var(--bg); }
.btn-sm { padding:3px 8px;font-size:11px; }
.job-bar { height:4px;background:var(--surface-hi);border-radius:2px;overflow:hidden;margin:2px 0; }
.job-bar-fill { height:100%;border-radius:2px;transition:width .3s;background:var(--primary); }
.job-bar-fill.done { background:var(--good); }
.job-bar-fill.failed { background:var(--danger); }
.job-status { font-size:11px;font-weight:600; }
.job-status.queued { color:var(--muted); }
.job-status.running { color:var(--primary); }
.job-status.completed { color:var(--good); }
.job-status.failed { color:var(--danger); }
.job-logs { font-size:10px;color:var(--muted-fg);font-family:monospace;max-height:80px;overflow-y:auto;background:var(--bg);padding:4px 8px;border-radius:var(--radius-sm);margin-top:4px; }
.disk-bar { height:4px;background:var(--surface-hi);border-radius:2px;overflow:hidden; }
.disk-bar-fill { height:100%;border-radius:2px; }
.disk-bar-fill.safe { background:var(--good); }
.disk-bar-fill.warn { background:var(--warn); }
.disk-bar-fill.danger { background:var(--danger); }
.pg-grid { display:flex;gap:3px;flex-wrap:wrap; }
.pg-dot { width:10px;height:10px;border-radius:2px; }
.pg-dot.done { background:var(--good); }
.pg-dot.running { background:var(--primary); }
.pg-dot.pending { background:var(--surface-hi); }
.pg-dot.fail { background:var(--danger); }
.panel-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.panel-grid .panel { display:flex;flex-direction:column;min-height:0;overflow:hidden; }
.panel-grid .panel .card-body { overflow-y:auto;flex:1;max-height:clamp(160px,45vh,520px); }
.modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100; }
.modal { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:500px;width:90%; }
.modal h3 { color:var(--warn);margin-bottom:12px; }
.modal .msg { color:var(--text);margin-bottom:12px;font-size:14px; }
.modal .list { color:var(--muted-fg);font-size:13px;max-height:150px;overflow-y:auto;margin-bottom:12px; }
.modal .btns { display:flex;gap:8px;justify-content:flex-end; }
.hist-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;font-size:12px; }
.hist-card .hc-desc { color:var(--text);font-weight:600;margin-bottom:4px; }
.hist-card .hc-detail { color:var(--muted-fg); }
.badge { font-size:11px;padding:2px 8px;border-radius:10px;background:var(--primary-bg);color:var(--primary); }
.conn-row { display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;font-size:12px; }
.prompt { text-align:center;padding:60px 20px; }
.prompt .icon { font-size:48px;margin-bottom:16px; }
.prompt .title { font-size:16px;color:var(--muted-fg);margin-bottom:8px; }
.prompt .hint { font-size:12px;color:var(--muted);margin-bottom:16px; }

.index-pager { display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted-fg);font-size:11px;flex-shrink:0; }
.index-range { margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap; }
.index-page-size,.index-page-number,.index-page-nav { display:flex;align-items:center;gap:5px;white-space:nowrap; }
.index-pager .search-box { padding:3px 5px;font-size:11px;min-height:26px; }
.index-page-size select { color-scheme:dark; }
.index-page-number input { width:48px;text-align:center;appearance:textfield; }
.index-page-number input::-webkit-inner-spin-button,.index-page-number input::-webkit-outer-spin-button { appearance:none;margin:0; }
.page-btn { display:grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer; }
.page-btn:hover:not(:disabled) { background:var(--surface-hi);border-color:var(--primary); }
.page-btn:disabled { opacity:.3;cursor:default; }
.page-btn:focus-visible,.index-pager .search-box:focus-visible { outline:2px solid var(--primary);outline-offset:2px; }
@media (max-width:700px) { .panel-grid { grid-template-columns:1fr; } }
</style>
<link rel="stylesheet" href="/remap.css">
</head>
<body>
<header><span class="logo">✦ estui</span><span class="subtitle">Elasticsearch TUI</span></header>
<nav>
  <button class="tab active" data-tab="indices">Indices</button>
  <button class="tab" data-tab="migration">Migration</button>
</nav>
<main id="main"></main>
<footer id="footer"><span id="footer-count"></span><span>estui v3.0</span></footer>
<div id="modal-container"></div>
<script src="/remap.js"></script>
<script src="/pagination.js"></script>
<script>
var S={tab:'indices',source:[],target:[],selected:{},dir:'source->target',jobs:[],migrating:false,
  indicesFilter:'',migrationFilter:'',targetFilter:'',disk:null,state:null,srcOK:false,tgtOK:false,srcInfo:null,tgtInfo:null,compat:null,query:'',desc:'',
  srcHost:'',tgtHost:'',
  nodeATag:'',nodeBTag:'',statusMsg:'',proxyMode:false};
function GET(u){return fetch(u).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function POST(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async function(r){var data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data})}
function E(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function F(n){return n?n.toLocaleString():'0'}
function H(h){return '<span class="health-dot '+h+'">'+h+'</span>'}
function L(s){return s==='open'?'<span class="status-open">open</span>':'<span class="status-close">close</span>'}
function Q(list,q){if(!q)return list;try{var re=new RegExp(q,'i');return list.filter(function(i){return re.test(i.name)})}catch(e){return list}}
async function loadAll(){
  try{var c=await GET('/api/clusters');S.srcHost=c.source.host;S.tgtHost=c.target.host;S.srcInfo=c.source;S.tgtInfo=c.target;S.srcOK=true;S.tgtOK=true}catch(e){S.srcOK=false;S.tgtOK=false;S.srcInfo=null;S.tgtInfo=null;S.source=[];S.target=[];return}
  try{var s=await GET('/api/indices/source');S.source=Array.isArray(s)?s:[];if(S.source.length>0)S.srcOK=true}catch(e){S.source=[];S.srcOK=false;S.srcInfo=null}
  try{var t=await GET('/api/indices/target');S.target=Array.isArray(t)?t:[]}catch(e){S.target=[];S.tgtOK=false;S.tgtInfo=null}
  try{S.disk=await GET('/api/disk')}catch(e){S.disk=null}
  try{S.state=await GET('/api/migrate/state')}catch(e){}}
async function loadJobs(){try{var d=await GET('/api/migrate/status');S.jobs=d.jobs||[];S.migrating=d.active||false}catch(e){}}
async function testSource(){
  var host=document.getElementById('src-host').value.trim();if(!host)return alert('Enter host');

  var btn=document.getElementById('test-src-btn'),dot=document.getElementById('src-dot');
  btn.textContent='...';btn.disabled=true;dot.className='dot testing';
  try{var r=await POST('/api/test-source',{host:host});
    if(r.ok){S.selected={};S.srcOK=true;S.srcInfo=r.info;dot.className='dot ok'}
    else {S.srcOK=false;dot.className='dot err';alert('Source: '+r.error)}}
  catch(e){S.srcOK=false;dot.className='dot err';alert('Source failed: '+e)}
  btn.textContent='Test';btn.disabled=false;await loadAll();updateView()}
async function testDest(){
  var host=document.getElementById('tgt-host').value.trim();if(!host)return alert('Enter host');

  var btn=document.getElementById('test-tgt-btn'),dot=document.getElementById('tgt-dot');
  btn.textContent='...';btn.disabled=true;dot.className='dot testing';
  try{var r=await POST('/api/test-dest',{host:host});
    if(r.ok){S.selected={};S.tgtOK=true;S.tgtInfo=r.info;dot.className='dot ok'}
    else {S.tgtOK=false;dot.className='dot err';alert('Dest: '+r.error)}}
  catch(e){S.tgtOK=false;dot.className='dot err';alert('Dest failed: '+e)}
  btn.textContent='Test';btn.disabled=false;await loadAll();updateView()}
function doFlip(){S.dir=S.dir==='source->target'?'target->source':'source->target';updateView()}
function tagA(){var tag=S.nodeATag||'';var name=S.srcInfo&&S.srcInfo.cluster_name||'Node A';return tag?tag+' \u2014 '+name:name}
function tagB(){var tag=S.nodeBTag||'';var name=S.tgtInfo&&S.tgtInfo.cluster_name||'Node B';return tag?tag+' \u2014 '+name:name}
// ==== Indices Tab ====
function renderIndices(){
  if(!S.srcOK&&S.source.length===0){
    var curHost=S.srcHost||'';
    var h='<div class="prompt"><div class="icon">🔒</div><div class="title">Connect to Elasticsearch</div><div class="hint">Enter host to view and manage indices</div>';
    h+='<div style="display:inline-flex;align-items:center;gap:8px;background:var(--surface);padding:8px 16px;border-radius:var(--radius)">';
    h+='<span class="dot" id="src-dot"></span><input id="src-host" class="search-box" placeholder="http://host:9200" style="width:260px" autocomplete="off" value="'+E(curHost)+'">';
    h+='<button class="btn" id="test-src-btn" onclick="testSource()">Test Connection</button></div></div>';
    var me=document.getElementById('main'),st=me.scrollTop,ae=document.activeElement,ai=ae?ae.id:'';
    me.innerHTML=h;me.scrollTop=st;
    if(ai==='src-host'){var si=document.getElementById('src-host');if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length)}}
    return;
  }
  var q=S.indicesFilter;
  var page=indexPage('indices',S.source,q,S.srcInfo&&S.srcInfo.cluster_uuid);
  var filtered=page.matches;
  var h='<div class="conn-row"><span class="dot ok" id="src-dot"></span>';
  h+='<input id="src-host" class="search-box" placeholder="http://host:9200" style="flex:none;width:220px" autocomplete="off" value="'+E(S.srcHost||'')+'">';
  h+='<button class="btn btn-sm" id="test-src-btn" onclick="testSource()">Reconnect</button>';
  if(S.srcInfo)h+='<span style="margin-left:8px;font-size:11px;color:var(--muted-fg)">'+E(S.srcInfo.cluster_name)+' \u00b7 v'+E(S.srcInfo.version)+' \u00b7 '+S.srcInfo.node_count+' nodes</span>';
  if(S.disk&&S.disk.source){var ds=S.disk.source,pct=ds.used_percent||0,cl=pct>85?'danger':pct>75?'warn':'safe';
    h+='<div class="disk-bar" style="width:80px;margin-left:12px"><div class="disk-bar-fill '+cl+'" style="width:'+pct+'%"></div></div><span style="color:var(--muted-fg);margin-left:4px;font-size:11px">'+pct+'% full, '+(100-pct)+'% free \u00b7 '+E(ds.total_human)+'</span>';}
  h+='</div>';
  if(S.statusMsg)h+='<div style="padding:6px 14px;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px">'+S.statusMsg+'</div>';
  h+='<div class="card"><div class="card-header"><span style="font-weight:700;color:var(--primary)">Indices</span>';
  h+='<input id="search" class="search-box" style="width:180px;flex:none" placeholder="/regex filter..." value="'+E(q)+'" oninput="setIndexFilter(\'indices\',this.value)">';
  h+='<span class="badge">'+filtered.length+'/'+S.source.length+'</span></div>';
  h+=indexPager('indices',page);
  if(filtered.length===0)h+='<div class="card-body empty">'+(S.source.length?'No matching indices':'No indices')+'</div>';
  else {h+='<div class="card-body" id="indices-rows"><table><thead><tr>';
    ['Sel','Index','Health','Status','Docs','Size','Pri','Rep'].forEach(function(hd){h+='<th>'+hd+'</th>';});
    h+='</tr></thead><tbody>';
    page.rows.forEach(function(idx){var is=S.selected[idx.name];
    h+='<tr class="'+(is?'sel':'')+'" data-click="idx" data-name="'+E(idx.name)+'"><td>'+(is?'\u2714':'\u2B1C')+'</td><td>'+E(idx.name)+(idx.target_index&&idx.target_index!==idx.name?' → '+E(idx.target_index):'')+'</td><td>'+H(idx.health)+'</td><td>'+L(idx.status)+'</td><td>'+F(idx.doc_count)+'</td><td>'+E(idx.size_human)+'</td><td>'+idx.primary+'</td><td>'+idx.replica+'</td></tr>';});
    h+='</tbody></table></div>';}
  h+='</div>';
  var sc=Object.keys(S.selected).length;
  h+='<div style="display:flex;gap:6px;padding:4px 0">';
  h+='<button class="btn btn-sm" data-click="idx-all" title="Select every matching index across all pages">All matches</button> <button class="btn btn-sm btn-danger" data-click="idx-none" title="Clear matching selections across all pages">Clear matches</button>';
  h+='<span style="color:var(--muted);font-size:12px;padding:4px 0">'+sc+' selected</span>';
  h+='<button class="btn btn-sm btn-danger" data-click="idx-delete" '+((sc===0)?'disabled':'')+'>Delete</button>';
  h+='<button class="btn btn-sm" data-click="idx-open" '+((sc===0)?'disabled':'')+'>Open</button>';
  h+='<button class="btn btn-sm btn-warn" data-click="idx-close" '+((sc===0)?'disabled':'')+'>Close</button>';
  h+='</div>';
  var me=document.getElementById('main'),bot=me.scrollHeight-me.scrollTop-me.clientHeight;
  var cbs=document.querySelectorAll('#main .card-body');
  var cbsBot=[];for(var i=0;i<cbs.length;i++)cbsBot.push(cbs[i].scrollHeight-cbs[i].scrollTop-cbs[i].clientHeight);
  var ae=document.activeElement,ai=ae?ae.id:'';
  me.innerHTML=h;
  me.scrollTop=Math.max(0,me.scrollHeight-bot-me.clientHeight);
  cbs=document.querySelectorAll('#main .card-body');
  var n=Math.min(cbsBot.length,cbs.length);
  for(i=0;i<n;i++){var b=Math.max(0,cbs[i].scrollHeight-cbsBot[i]-cbs[i].clientHeight);cbs[i].scrollTop=b;}
  if(ai==='search'){var si=document.getElementById('search');if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length)}}
}
// ==== Migration Tab ====
function renderMigration(){
  var h='';

  // Active migration card
  if(!S.migrating&&S.state&&S.state.active){
    var a=S.state.active;
    h+='<div class="card"><div class="card-header" style="flex-direction:column;align-items:flex-start">';
    h+='<div style="font-size:14px;font-weight:700;color:var(--text)">'+E(a.description||'Migration')+'</div>';
    h+='<div style="font-size:11px;color:var(--muted-fg)">';
    var nodeALabel=S.nodeATag?('<span style="color:var(--primary)">'+E(S.nodeATag)+'</span> \u2014 '):'';
    var nodeBLabel=S.nodeBTag?('<span style="color:var(--primary)">'+E(S.nodeBTag)+'</span> \u2014 '):'';
    var dirArrow=a.direction==='target->source'?' \u2190 ':' \u2192 ';
    h+='Node A: '+nodeALabel+'<span data-copy-host="'+E(a.source.host)+'" data-copy-side="src" style="cursor:pointer;text-decoration:underline;color:var(--muted-fg)" title="Copy">'+E(a.source.host)+'</span>';
    h+=dirArrow;
    h+='Node B: '+nodeBLabel;
    h+='<span data-copy-host="'+E(a.dest.host)+'" data-copy-side="tgt" style="cursor:pointer;text-decoration:underline;color:var(--muted-fg)" title="Copy">'+E(a.dest.host)+'</span>';
    h+=' \u00b7 Started: '+new Date(a.started_at).toLocaleString();
    if(a.query)h+=' \u00b7 Query: <code style="background:var(--surface-hi);color:var(--primary);padding:1px 6px;border-radius:3px;font-size:11px">'+E(a.query)+'</code>';
    h+='</div></div><div class="card-body" style="padding:8px 14px">';
    a.indices.forEach(function(idx){
      var cls=(idx.status==='completed'||idx.status==='skipped')?'done':idx.status==='running'?'running':idx.status==='failed'?'fail':'pending';
      h+='<div style="display:flex;align-items:center;gap:8px;margin:2px 0;font-size:12px">';
      h+='<span style="width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(idx.name)+(idx.target_index&&idx.target_index!==idx.name?' → '+E(idx.target_index):'')+'</span>';
      h+='<div class="pg-grid" style="flex:1">';for(var i=0;i<10;i++)h+='<div class="pg-dot '+cls+'"></div>';h+='</div>';
      h+='<span style="color:var(--muted-fg);min-width:70px;text-align:right">'+idx.status+(idx.docs_total>0?' '+F(idx.transferred)+'/'+F(idx.docs_total):'')+'</span></div>';
      h+=remapSummary(idx.remap);
      if(idx.error)h+='<div style="color:var(--danger);font-size:11px;margin-bottom:6px">'+E(idx.error)+'</div>';
    });
    var done=a.indices.filter(function(i){return i.status==='completed'||i.status==='skipped'}).length;
    var left=a.indices.filter(function(i){return i.status!=='completed'&&i.status!=='skipped'}).length;
    h+='<div style="display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">';
    h+='<span style="font-size:11px;color:var(--muted-fg)">'+done+' done \u00b7 '+left+' remaining</span><span style="flex:1"></span>';
    h+='<button class="btn btn-sm" onclick="checkCompat()">Check Compat</button>';
    h+='<button class="btn" onclick="doContinue()">Continue</button>';
    h+='<button class="btn btn-sm btn-danger" onclick="doAbandon()">Abandon</button>';
    h+='</div></div></div>';
    if(S.compat){h+='<div class="card"><div class="card-body" style="padding:8px 14px;font-size:12px">';
      var sm=S.compat.source.match?'\u2705':'\u274c',tm=S.compat.dest.match?'\u2705':'\u274c';
      h+='Node A: '+sm+' saved:'+E(S.compat.source.saved.name)+'/'+E(S.compat.source.saved.host);
      if(S.compat.source.current)h+=' | now:'+E(S.compat.source.current.name);
      h+='<br>Node B: '+tm+' saved:'+E(S.compat.dest.saved.name)+'/'+E(S.compat.dest.saved.host);
      if(S.compat.dest.current)h+=' | now:'+E(S.compat.dest.current.name);

// Event delegation
document.getElementById('main').addEventListener('click',function(e){
  var copy=e.target.closest('[data-copy-host]');if(copy){copyHost(copy.dataset.copySide,copy.dataset.copyHost);return}var el=e.target.closest('[data-click]');if(!el)return;
  var cmd=el.dataset.click,name=el.dataset.name;
  if(cmd==='page'){if(!el.disabled)setIndexPage(el.dataset.list,el.dataset.page)}
  else if(cmd==='idx'){if(S.selected[name]){delete S.selected[name]}else{S.selected[name]=true};renderIndices()}
  else if(cmd==='idx-all'){Q(S.source,S.indicesFilter).forEach(function(i){S.selected[i.name]=true});renderIndices()}
  else if(cmd==='idx-none'){Q(S.source,S.indicesFilter).forEach(function(i){delete S.selected[i.name]});renderIndices()}
  else if(cmd==='idx-delete'){showConfirm('delete',Object.keys(S.selected),function(){runBulk('delete')})}
  else if(cmd==='idx-open'){showConfirm('open',Object.keys(S.selected),function(){runBulk('open')})}
  else if(cmd==='idx-close'){showConfirm('close',Object.keys(S.selected),function(){runBulk('close')})}
  else if(cmd==='mig'){if(S.selected[name]){delete S.selected[name]}else{S.selected[name]=true};renderMigration()}
  else if(cmd==='mig-all-src'){Q(S.source,S.migrationFilter||'').forEach(function(i){S.selected[i.name]=true});renderMigration()}
  else if(cmd==='mig-none-src'){Q(S.source,S.migrationFilter||'').forEach(function(i){delete S.selected[i.name]});renderMigration()}
  else if(cmd==='mig-all-tgt'){Q(S.target,S.targetFilter||'').forEach(function(i){S.selected[i.name]=true});renderMigration()}
  else if(cmd==='mig-none-tgt'){Q(S.target,S.targetFilter||'').forEach(function(i){delete S.selected[i.name]});renderMigration()}
  else if(cmd==='mig-start'){startMigrate()}
  else if(cmd==='mig-remap'){startRemap()}
});

    h+='<div class="msg" style="color:var(--warn)"><strong>'+existing.length+'</strong> indices already exist on '+E(destName)+destTag+' ('+E(destHost)+'). Choose what to do:</div>';
    h+='<div class="list">'+existing.map(function(n){return '<div>'+E(n)+'</div>'}).join('')+'</div>';
    h+='<label style="display:block;margin:10px 0"><input type="radio" name="collision-action" value="rename" checked> Reindex into a new name: original_reindex_&lt;unique suffix&gt; (preserves existing data)</label>';
    h+='<label style="display:block;margin:10px 0"><input type="radio" name="collision-action" value="overwrite"> Overwrite using the same index name</label>';
    h+='<div class="msg" style="color:var(--danger)">Overwrite permanently replaces the old destination data and index configuration, including its aliases. Stop destination writers and write-block those indices first. A verified temporary copy is prepared before replacement; a failed cutover may leave the original name unavailable.</div>';
    h+='<label style="display:block;margin:10px 0"><input type="checkbox" id="overwrite-ack"> I understand that overwriting permanently deletes the old destination data.</label>';
  }

  if(!local&&newOnly.length>0){
    h+='<div class="msg" style="color:var(--good)"><strong>'+newOnly.length+'</strong> new to '+E(destName)+destTag+':</div>';
    h+='<div class="list">'+newOnly.map(function(n){return '<div>\u2022 '+E(n)+'</div>'}).join('')+'</div>';
  }

  h+='<div class="btns"><button class="btn btn-danger" id="modal-confirm">Yes, migrate</button><button class="btn" id="modal-cancel">Cancel</button></div></div></div>';
  document.getElementById('modal-container').innerHTML=h;
  document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal()});
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-confirm').addEventListener('click',function(){var selected=document.querySelector('input[name="collision-action"]:checked');var choice=local?'rename':(selected?selected.value:'');if(choice==='overwrite'&&!document.getElementById('overwrite-ack').checked){alert('Confirm that the old destination data will be permanently deleted.');return}closeModal();doMigrate(names,desc,choice,intent)});}
function showConfirm(action,names,fn){if(!names.length)return;var sourceUUID=S.srcInfo&&S.srcInfo.cluster_uuid;
  var lbl={delete:'Delete',open:'Open',close:'Close'},msgs={delete:'Delete '+names.length+' indices? Cannot be undone.',open:'Open '+names.length+' indices.',close:'Close '+names.length+' indices.'};
  var h='<div class="modal-overlay" id="modal-bg"><div class="modal"><h3>\u26a0 '+lbl[action]+' '+names.length+' indices?</h3><div class="msg">'+msgs[action]+'</div>';
  h+='<div class="list">'+names.map(function(n){return '<div>\u2022 '+E(n)+'</div>'}).join('')+'</div>';
  h+='<div class="btns"><button class="btn btn-danger" id="modal-confirm">Yes</button><button class="btn" id="modal-cancel">Cancel</button></div></div></div>';
  document.getElementById('modal-container').innerHTML=h;
  document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal()});
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-confirm').addEventListener('click',function(){closeModal();runBulk(action,names,sourceUUID)});}
function closeModal(){document.getElementById('modal-container').innerHTML=''}
async function runBulk(action,names,sourceUUID){
  names=names||Object.keys(S.selected);sourceUUID=sourceUUID||(S.srcInfo&&S.srcInfo.cluster_uuid);var count=names.length;
  var lbl={delete:'Deleting',open:'Opening',close:'Closing'};
  S.statusMsg='<span style="animation:blink .6s infinite alternate">\u27F3</span> '+lbl[action]+' '+count+' indices...';renderIndices();
  try{var result=await POST('/api/indices/'+action,{indices:names,source_uuid:sourceUUID});var failed=(result.results||[]).filter(function(r){return !r.ok});if(!result.results||result.results.length!==names.length)throw new Error('Incomplete action response');S.selected={};failed.forEach(function(r){S.selected[r.index]=true});S.statusMsg=E((count-failed.length)+' succeeded, '+failed.length+' failed'+(failed.length?': '+failed.map(function(r){return r.index+': '+r.error}).join('; '):''));}catch(e){S.statusMsg='\u274C Error: '+E(String(e))}
  await loadAll();renderIndices();
  setTimeout(function(){S.statusMsg='';renderIndices()},3000);
}
function updateFooter(){document.getElementById('footer-count').textContent=S.source.length+' src \u00b7 '+S.target.length+' tgt indices'}
function updateView(){if(S.tab==='indices')renderIndices();else renderMigration();updateFooter()}

document.querySelectorAll('nav button.tab').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('nav button.tab').forEach(function(x){x.classList.remove('active')});
  this.classList.add('active');S.tab=this.dataset.tab;updateView();});});
async function init(){await loadAll();await loadJobs();updateView();
  setInterval(async function(){var ae=document.activeElement,ai=ae?ae.id:'';if(ae&&ae.dataset&&ae.dataset.paginationControl)return;if(ai==='src-host'||ai==='tgt-host'||ai==='mig-desc'||ai==='preview-idx'||ai==='mig-query'||ai==='nodea-tag'||ai==='nodeb-tag')return;await Promise.all([loadAll(),loadJobs()]);updateView()},3000);}
init();
</script>
</body>
